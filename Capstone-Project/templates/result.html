<!DOCTYPE html>
<html>

<head>

    <title>Prediction Result</title>

    <style>

        body {
            background-color: #121212;
            font-family: Arial;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            background-color: #1e1e1e;

            padding: 40px;

            border-radius: 15px;

            width: 400px;

            text-align: center;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00d4ff;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        a {

            color: #00d4ff;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Prediction Result</h1>

        <p>Tenure: {{ tenure }}</p>

        <p>Monthly Charges: {{ monthlycharges }}</p>

        <p>Total Charges: {{ totalcharges }}</p>

        <p>Contract Type: {{ contract }}</p>

        <div class="result">
            {{ result }}
        </div>

        <br>

        <a href="/">← Go Back</a>

    </div>

</body>

</html>
